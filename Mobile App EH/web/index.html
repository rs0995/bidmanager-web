<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BM Pro EH — browser preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dcd9e6;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root {
        display: flex;
        position: relative;
        width: 430px;
        height: 932px;
        flex: none;
        border-radius: 56px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 0 0 11px #17151c, 0 0 0 13px #3a3742,
          0 30px 80px -20px rgba(30, 20, 60, 0.5);
        transform-origin: center center;
      }
      .bm-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 210px;
        padding: 14px;
        border-radius: 16px;
        background: #ffffff;
        font: 12px/1.3 system-ui, sans-serif;
        color: #18151f;
        box-shadow: 0 10px 30px -12px rgba(30, 20, 60, 0.35);
      }
      .bm-panel .hd {
        font-weight: 700;
        margin-bottom: 10px;
      }
      .bm-panel .grp {
        margin-bottom: 12px;
      }
      .bm-panel .ttl {
        color: #7a7688;
        margin-bottom: 6px;
        font-size: 11px;
      }
      .bm-panel .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .bm-panel button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      .bm-panel .opt {
        padding: 6px 10px;
        border-radius: 999px;
        background: #efedf5;
        color: #18151f;
      }
      .bm-panel .opt[aria-pressed='true'] {
        background: #18151f;
        color: #fff;
      }
      .bm-panel .sw {
        width: 24px;
        height: 24px;
        border-radius: 8px;
      }
      .bm-panel .sw[aria-pressed='true'] {
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px #18151f;
      }
      @media (max-width: 1000px) {
        .bm-panel {
          display: none;
        }
      }
      @media (max-width: 440px) {
        html,
        body {
          background: #fff;
        }
        #root {
          width: 100vw;
          height: 100vh;
          max-height: none;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
