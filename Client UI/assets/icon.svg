<!--
  BidManager Client — app icon (master).

  Three rising bars (the bid climbing) under an award tick (the win / a
  completed checklist). Palette is the app's own: the accent blue from
  globals.css (--accent #5b8af5 / #3b6ce7) on a navy tile drawn from the dark
  theme's surfaces, with the emerald used for "Completed" checklist rows.
  Deliberately unlike the Bidwise icon (black-to-orange, slab shapes).

  Shapes are kept chunky and few so the mark survives down to 16px, where
  Windows renders it most often. The badge sits on a tile-coloured ring so it
  stays separate from the blue bar behind it at small sizes.

  Regenerate the raster set (assets/icon.ico + PNGs, electron/icon.png) after
  editing this file — see the usage block in render-icons.cjs beside it.

  Why assets/ and not electron-builder's conventional build/icon.ico: the repo
  root .gitignore has a bare `build/` rule (which Server UI/build needs), so an
  icon there would never be committed and every other machine's installer would
  silently fall back to the stock Electron icon. package.json points
  build.win.icon at this folder instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#273352"/>
      <stop offset="1" stop-color="#0f1422"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b6ce7"/>
      <stop offset="1" stop-color="#8db0ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="196" y="576" width="156" height="236" rx="42" fill="#5f719a"/>
  <rect x="382" y="452" width="156" height="360" rx="42" fill="#8ca7d8"/>
  <rect x="568" y="304" width="156" height="508" rx="42" fill="url(#bar)"/>
  <circle cx="716" cy="292" r="168" fill="#131a2b"/>
  <circle cx="716" cy="292" r="146" fill="#10b981"/>
  <path d="M644 294 L697 348 L792 240" fill="none" stroke="#ffffff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
