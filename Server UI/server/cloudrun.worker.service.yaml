apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bidmanager-worker
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/bidmanager-worker:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          env:
            - name: BIDMANAGER_ENV
              value: production
            - name: BIDMANAGER_PROCESS_ROLE
              value: worker
            - name: BIDMANAGER_HEADLESS
              value: "true"
            - name: BIDMANAGER_BROWSER
              value: firefox
            - name: BIDMANAGER_WORKER_THREADS
              value: "2"
            - name: GOOGLE_DRIVE_FOLDER_ID
              value: REPLACE_WITH_DRIVE_FOLDER_ID
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bidmanager-database-url
                  key: latest
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bidmanager-admin-api-key
                  key: latest
            - name: BIDMANAGER_CLIENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bidmanager-client-api-key
                  key: latest
            - name: BIDMANAGER_DOWNLOAD_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: bidmanager-download-token-secret
                  key: latest
