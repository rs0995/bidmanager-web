<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BM Server app icon. Same flat style as the client app's clipboard icon,
       in the desktop Server UI indigo: a white server rack with a green
       "live" pulse badge. Full-bleed square, no transparency (iOS masks it). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A44" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#23408E"/>
  <g filter="url(#shadow)">
    <!-- three rack units -->
    <rect x="262" y="250" width="500" height="148" rx="34" fill="#FFFFFF"/>
    <rect x="262" y="438" width="500" height="148" rx="34" fill="#FFFFFF"/>
    <rect x="262" y="626" width="500" height="148" rx="34" fill="#FFFFFF"/>
  </g>
  <!-- drive bays -->
  <g fill="#B9C6E6">
    <rect x="320" y="308" width="210" height="32" rx="16"/>
    <rect x="320" y="496" width="210" height="32" rx="16"/>
    <rect x="320" y="684" width="150" height="32" rx="16"/>
  </g>
  <!-- status lights -->
  <g fill="#23408E">
    <circle cx="660" cy="324" r="22"/>
    <circle cx="660" cy="512" r="22"/>
  </g>
  <!-- live badge -->
  <g filter="url(#shadow)">
    <circle cx="712" cy="732" r="138" fill="#21B35A"/>
  </g>
  <polyline points="626,738 672,738 698,674 734,800 760,738 798,738"
            fill="none" stroke="#FFFFFF" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
