apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bidmanager-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 900
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/bidmanager-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: BIDMANAGER_CORS_ORIGINS
              value: http://localhost:5173,bidmanager://app
            - name: BIDMANAGER_HEADLESS
              value: "true"
