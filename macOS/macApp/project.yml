name: BidManagerClient
options:
  bundleIdPrefix: com.bidmanager
  deploymentTarget:
    macOS: "13.0"
targets:
  BidManagerClient:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: WebAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bidmanager.client.mac
        PRODUCT_NAME: BidManagerClient
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: "NO"
